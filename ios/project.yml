name: PhoneMic
options:
  bundleIdPrefix: local.phonemic
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    HEADER_SEARCH_PATHS: '$(SRCROOT)/../shared'
    SWIFT_OBJC_BRIDGING_HEADER: PhoneMic/PhoneMic-Bridging-Header.h
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PhoneMic:
    type: application
    platform: iOS
    sources:
      - path: PhoneMic
    info:
      path: PhoneMic/Info.plist
      properties:
        CFBundleDisplayName: PhoneMic
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: PhoneMic streams your microphone to your Linux PC for games and voice input.
        NSLocalNetworkUsageDescription: PhoneMic sends microphone audio directly to your PC over Wi-Fi.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.phonemic.app
        GENERATE_INFOPLIST_FILE: false
schemes:
  PhoneMic:
    build:
      targets:
        PhoneMic: all
